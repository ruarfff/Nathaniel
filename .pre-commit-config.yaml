# Pre-commit hooks for Nathaniel
# https://pre-commit.com

repos:
  # SwiftFormat - runs first to auto-fix formatting
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat
        language: system
        types: [swift]
        exclude: ^Legacy/

  # SwiftLint - runs second to catch remaining issues
  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --quiet
        language: system
        types: [swift]
        exclude: ^Legacy/
