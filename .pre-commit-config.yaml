# Pre-commit hooks for Nathaniel
# https://pre-commit.com

repos:
  # Beads issue tracking - ensure issues are synced
  - repo: local
    hooks:
      - id: beads
        name: Beads Sync
        entry: bd hooks run pre-commit
        language: system
        always_run: true
        pass_filenames: false

  # SwiftFormat - runs first to auto-fix formatting
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat
        language: system
        types: [swift]
        exclude: ^Legacy/

  # SwiftLint - runs second to catch remaining issues
  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --quiet
        language: system
        types: [swift]
        exclude: ^Legacy/
